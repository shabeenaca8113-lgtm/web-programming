<!DOCTYPE html>
<html>
<head>
<title>Striped table</title>
<style>
#myTable{
width:100%;
font-family:sans-serif;
border-collapse:collapse;
}
#myTable th{
padding-top:20px;
padding-bottom:20px;
text-align:left;
color:white;
background-color:#b22222;
color:white;
border:1px solid grey;
}
#myTable td{
padding:8px;
border:1px solid grey;
}
#myTable tr:nth-child(odd){
background-color:#f2f2f2;
}
#myTable tr:nth-child(odd):hover{
background-color:burlywood;
}
</style>
</head>
<body>
<table id="myTable">
<tr>
<th>SL No</th>
<th>Admission No</th>
<th>Name</th>
<th>Email Id</th>
</tr>

</tr>

</body>
</html>
